<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>财报跟踪平台 · 永安期货研究</title>
<link rel="stylesheet" href="assets/style.03a743bb.css">
</head>
<body>

<!-- 密码门：本地防窥门槛，非安全加密 -->
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-logo">YAFCO RESEARCH</div>
    <h1>财报跟踪平台</h1>
    <p class="gate-sub">全球锡 / 锌企业财报产量数据跟踪</p>
    <input type="password" id="gate-input" placeholder="请输入访问密码" autocomplete="off">
    <button id="gate-btn">进入</button>
    <p class="gate-err" id="gate-err"></p>
    <p class="gate-note">本地防窥门槛，非安全加密</p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="app" style="display:none">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">YAFCO</span>
      <span class="brand-title">财报跟踪平台</span>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="build-time" id="build-time"></div>
  </header>
  <main id="main"></main>
  <footer class="footer">
    数据来源：公司官方财报 / 业绩公告 · 本页面为本地静态文件，双击 index.html 即可使用 · 构建于 <span id="build-time-2"></span>
  </footer>
</div>

<script src="assets/echarts.min.js"></script>
<script>if (typeof echarts === "undefined") document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"><\/script>');</script>
<script src="data/data.0968088d.js"></script>
<script src="assets/app.e27d4dad.js"></script>
<script>
sessionStorage.setItem("yafco_gate_ok","1");
window.addEventListener("load", function(){
  document.querySelectorAll("#tabs .tab").forEach(function(t){ if (t.dataset.key === "zinc") t.click(); });
  setTimeout(function(){
    var subs = document.querySelectorAll("#main .section-sub");
    subs.forEach(function(s){ if (s.textContent.indexOf("C1") >= 0) s.closest(".panel").scrollIntoView({block:"center"}); });
  }, 1200);
});
</script>

</body>
</html>
